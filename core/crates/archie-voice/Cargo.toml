[package]
name = "archie-voice"
description = "Archie's voice: the ears, the voice and the model behind the speech plane, and the tools it may propose."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Nemotron 3.5 ASR and Magpie TTS through NVIDIA NeMo-Speech.cpp's C ABI. Needs the SDK
# installed and NEMO_SPEECH_PREFIX pointing at it when building.
nemo = []
# Scoped Wanda client without a speech SDK; `live` uses the same adapter.
wanda = ["dep:archie-wanda"]
# The microphone and the speaker, through PulseAudio (a Linux desktop, or WSLg).
pulse = ["dep:libpulse-binding", "dep:libpulse-simple-binding"]
# A spoken conversation: both of the above.
speech = ["nemo", "pulse"]
# A voice converted into another (an RVC v2 voice exported to ONNX), run by ONNX Runtime.
rvc = ["dep:ort", "dep:serde"]
# A live session reached from a browser: its microphone, speaker and camera over a
# WebSocket, IRIS for eyes, and curiosity (identify and search) for what is in front.
live = [
    "nemo", "wanda", "dep:axum", "dep:reqwest", "dep:futures-util", "dep:serde", "dep:base64",
    "dep:png", "dep:jpeg-decoder", "dep:archie-search", "dep:ring", "dep:zeroize", "dep:archie-worldd", "dep:archie-geofabric", "dep:archie-core",
]

[dependencies]
archie-types.workspace = true
archie-orb.workspace = true
archie-speech.workspace = true
archie-model-runtime.workspace = true
archie-registry.workspace = true
archie-router.workspace = true
archie-vault.workspace = true
archie-stage.workspace = true
archie-sight.workspace = true
archie-a11y.workspace = true
archie-iris.workspace = true
archie-notices.workspace = true
archie-policy.workspace = true
archie-wanda = { workspace = true, optional = true }
archie-worldd = { workspace = true, optional = true }
archie-core = { workspace = true, optional = true }
archie-geofabric = { workspace = true, optional = true }
hex.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
# The clock the model is given, read before any thread starts so the local offset is known.
time = { workspace = true, features = ["local-offset"] }
axum = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
png = { workspace = true, optional = true }
jpeg-decoder = { workspace = true, optional = true }
archie-search = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
libpulse-binding = { version = "2", optional = true }
libpulse-simple-binding = { version = "2", optional = true }

[[bin]]
name = "archie-voice"
path = "src/bin/archie-voice.rs"
