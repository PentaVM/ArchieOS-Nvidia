[package]
name = "archie-worldd"
description = "Network-isolated authoritative world-data adapter for ArchieOS."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "archie_worldd"
path = "src/lib.rs"

[[bin]]
name = "archie-worldd"
path = "src/main.rs"
required-features = ["provider"]

[features]
default = ["provider"]
provider = [
    "dep:archie-observability",
    "dep:clap",
    "dep:reqwest",
    "dep:tokio",
    "dep:tracing",
    "dep:rand",
    "dep:sha2",
    "dep:fs2",
    "dep:tiff",
    "dep:earcutr",
    "dep:httpdate",
    "dep:base64", "dep:png", "dep:jpeg-decoder", "dep:time",
]

[dependencies]
archie-observability = { workspace = true, optional = true }
archie-types.workspace = true
archie-geofabric.workspace = true
clap = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tracing = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
tiff = { version = "0.10", optional = true }
earcutr = { version = "0.4", optional = true }
httpdate = { version = "1", optional = true }
base64 = { workspace = true, optional = true }
png = { workspace = true, optional = true }
jpeg-decoder = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
