[package]
name = "archie-cli"
description = "The ArchieOS command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "archie"
path = "src/main.rs"

[dependencies]
archie-core.workspace = true
archie-fabric.workspace = true
archie-iris.workspace = true
archie-orb.workspace = true
archie-model-runtime.workspace = true
archie-memory.workspace = true
archie-policy.workspace = true
archie-vault.workspace = true
archie-state.workspace = true
archie-types.workspace = true
archie-workstation.workspace = true
archie-geofabric.workspace = true
archie-worldd = { workspace = true, features = ["provider"] }
clap.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
