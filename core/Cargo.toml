# ArchieOS control plane — Cargo workspace.
#
# The workspace contains the trusted Rust control plane plus two deliberately
# unprivileged display projection crates. Only `archie-core` and its authority
# dependencies may hold identity keys or make policy/scheduler decisions.
# `archie-displayd` is read-only and `archie-worldd` has no Archie state access.

[workspace]
resolver = "2"
members = [
    "crates/archie-types",
    "crates/archie-notices",
    "crates/archie-observability",
    "crates/archie-state",
    "crates/archie-postgres",
    "crates/archie-policy",
    "crates/archie-registry",
    "crates/archie-fabric",
    "crates/archie-scheduler",
    "crates/archie-execution",
    "crates/archie-executord",
    "crates/archie-task-runner",
    "crates/archie-router",
    "crates/archie-memory",
    "crates/archie-core",
    "crates/archie-displayd",
    "crates/archie-worldd",
    "crates/archied",
    "crates/archie-cli",
    "crates/archie-installer",
    "crates/archie-speech",
    "crates/archie-voice",
    "crates/archie-cut",
    "crates/archie-iris-bridge",
    "crates/archie-geofabric",
    "crates/archie-model-runtime",
    "crates/archie-vault",
    "crates/archie-mcp",
    "crates/archie-search",
    "crates/archie-stage",
    "crates/archie-mcp-server",
    "crates/archie-skill-node",
    "crates/archie-bridges",
    "crates/archie-desk",
    "crates/archie-toolpack",
    "crates/archie-sight",
    "crates/archie-a11y",
    "crates/archie-reflex",
    "crates/archie-paint",
    "crates/archie-arena",
    "crates/archie-cerebra",
    "crates/archie-wanda",
    "crates/archie-wanda-lncm",
    "crates/archie-workstation",
    "crates/archie-iris",
    "crates/archie-iris-runtime",
    "crates/archie-camera",
    "crates/archie-iris-visor",
    "crates/archie-accel",
    "crates/archie-slink",
    "crates/archie-orb",
    "crates/archie-rem",
    "crates/archie-lan",
    "crates/archie-sentry",
    "crates/archie-shell-bridge",
    "crates/archie-lumen-design",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/PentaVM/ArchieOS-Nvidia"

[workspace.dependencies]
# Internal crates.
archie-types = { path = "crates/archie-types" }
archie-notices = { path = "crates/archie-notices" }
archie-observability = { path = "crates/archie-observability" }
archie-state = { path = "crates/archie-state" }
archie-postgres = { path = "crates/archie-postgres" }
archie-policy = { path = "crates/archie-policy" }
archie-registry = { path = "crates/archie-registry" }
archie-fabric = { path = "crates/archie-fabric" }
archie-scheduler = { path = "crates/archie-scheduler" }
archie-execution = { path = "crates/archie-execution" }
archie-executord = { path = "crates/archie-executord" }
archie-task-runner = { path = "crates/archie-task-runner" }
archie-router = { path = "crates/archie-router" }
archie-memory = { path = "crates/archie-memory" }
archie-core = { path = "crates/archie-core" }
archie-installer = { path = "crates/archie-installer" }
archie-speech = { path = "crates/archie-speech" }
archie-voice = { path = "crates/archie-voice" }
archie-cut = { path = "crates/archie-cut" }
archie-iris-bridge = { path = "crates/archie-iris-bridge" }
archie-geofabric = { path = "crates/archie-geofabric" }
archie-sentry = { path = "crates/archie-sentry" }
archie-displayd = { path = "crates/archie-displayd" }
archie-worldd = { path = "crates/archie-worldd", default-features = false }
archie-model-runtime = { path = "crates/archie-model-runtime" }
archie-rem = { path = "crates/archie-rem" }
archie-vault = { path = "crates/archie-vault" }
archie-mcp = { path = "crates/archie-mcp" }
archie-search = { path = "crates/archie-search" }
archie-stage = { path = "crates/archie-stage" }
archie-mcp-server = { path = "crates/archie-mcp-server" }
archie-bridges = { path = "crates/archie-bridges" }
archie-desk = { path = "crates/archie-desk" }
archie-toolpack = { path = "crates/archie-toolpack" }
archie-sight = { path = "crates/archie-sight" }
archie-a11y = { path = "crates/archie-a11y" }
archie-reflex = { path = "crates/archie-reflex" }
archie-paint = { path = "crates/archie-paint" }
archie-cerebra = { path = "crates/archie-cerebra" }
archie-wanda = { path = "crates/archie-wanda" }
archie-wanda-lncm = { path = "crates/archie-wanda-lncm" }
archie-workstation = { path = "crates/archie-workstation" }
archie-iris = { path = "crates/archie-iris" }
archie-iris-runtime = { path = "crates/archie-iris-runtime" }
archie-accel = { path = "crates/archie-accel" }
archie-slink = { path = "crates/archie-slink" }
archie-orb = { path = "crates/archie-orb" }
archie-shell-bridge = { path = "crates/archie-shell-bridge" }

# External.
anyhow = "1"
# Wanda LNCM: tensors, autograd and safetensors in Rust. The same minor line the IRIS
# runtime uses, so the workspace carries one copy.
candle-core = "0.9"
candle-nn = "0.9"
async-trait = "0.1"
base64 = "0.22"
jpeg-decoder = "0.3"
png = "0.18"
# Archie's live page: the browser's microphone, speaker and camera over a WebSocket.
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "ws"] }
# ONNX Runtime, loaded at run time from the official shared library (ORT_DYLIB_PATH): no
# binaries are downloaded while building.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-22"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "pem"] }
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
postgres = "=0.19.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ring = "0.17"
# Raw TLS for CAST v2 (port 8009). Same rustls/ring stack reqwest already pulls in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Protobuf in pure Rust, derive only (no protoc at build time). CAST v2 frames.
prost = { version = "0.14", default-features = false, features = ["std", "derive"] }
# The accessibility bus is D-Bus; zbus speaks it in Rust, on tokio, with no C library.
zbus = { version = "5", default-features = false, features = ["tokio"] }
sha2 = "0.10"
sysinfo = "0.33"
tar = { version = "0.4", default-features = false }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "process"] }
libc = "0.2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

# The desktop development launcher streams and decodes real city geometry.
# Optimize this hot path without rebuilding the whole daemon workspace in release.
[profile.dev.package.archie-worldd]
opt-level = 2
